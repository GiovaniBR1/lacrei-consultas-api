name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: consultas
          POSTGRES_PASSWORD: consultas
          POSTGRES_DB: consultas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consultas -d consultas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://consultas:consultas@localhost:5432/consultas_test
      SECRET_KEY: ci-only-not-for-production-0123456789abcdefghijklmnop
      DJANGO_SETTINGS_MODULE: config.settings.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Run tests
        run: poetry run python manage.py test --settings=config.settings.local
