services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consultas
      POSTGRES_PASSWORD: consultas
      POSTGRES_DB: consultas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultas -d consultas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://consultas:consultas@db:5432/consultas
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-compose-secret-not-for-prod
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
